version: "3.8"
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./configs/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./hls:/hls
    ports:
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    environment:
      - MEDIAMTX_CONFIG_PATH=/mediamtx.yml

  backend:
    image: python:3.11-slim
    container_name: sentinel-backend
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -lc "
        pip install --no-cache-dir fastapi uvicorn[standard] pydantic pyjwt &&
        uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1
      "
    volumes:
      - ../apps/backend:/app
    expose:
      - "10000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SENTINEL_JWT_SECRET=${SENTINEL_JWT_SECRET:-change-me-please-32-chars-min}
      - STREAM_DOMAIN=${STREAM_DOMAIN:-54.206.49.163}
      - BASE_RTSP_PORT=8554

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hls:/hls
      - ./caddy_data:/data
      - ./caddy_config:/config

networks:
  default:
    name: sentinel-network